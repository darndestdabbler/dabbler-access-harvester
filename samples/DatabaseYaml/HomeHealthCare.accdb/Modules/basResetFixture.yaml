  Private Sub InsNeed(ByVal db As DAO.Database, _
                      ByVal id As Long, ByVal ClientID As Long, ByVal svcId As Long, _
                      ByVal fy As Integer, ByVal Priority As Integer, _
                      ByVal days As String, ByVal startTime As Variant, _
                      ByVal endTime As Variant, ByVal Hours As Double)
      db.Execute "INSERT INTO tblClientServiceNeeds (ClientServiceNeedID, ClientID, ServiceID, FiscalYear, " & _
                 "Priority, DaysOfWeek, PreferredTimeStart, PreferredTimeEnd, HoursPerWeek) VALUES (" & _
                 id & ", " & ClientID & ", " & svcId & ", " & fy & ", " & Priority & ", " & _
                 SqlStr(days) & ", " & TimeLit(startTime) & ", " & TimeLit(endTime) & ", " & Hours & ")", _
                 dbFailOnError
  End Sub
  
  ' --------------------------------------------------------------------------
  ' Phase 3h - Client service plans (52 rows)
  ' WeeklyCost and AnnualEstCost are derived by the BeforeChange data macro
  ' from RatePerHour x HoursPerWeek (x52 for annual). Status is derived from
  ' ApprovalDate Is Not Null (Approved) vs Null (Pending), EXCEPT for the one
  ' Cancelled plan which requires the macro fix in design doc section 0.
  '
  ' Per-client+FY annualized totals are designed so all approved plans fit
  ' within budget. The Daniel/FY25 pending plan is the deliberate exception:
  ' approving it would push over budget by ~$160 and trip dmValidateBudgetOnApproval.
  ' --------------------------------------------------------------------------
  
  Private Sub SeedClientServicePlans(ByVal db As DAO.Database)
      Debug.Print "  Seeding 52 client service plans..."
  
      ' --- Client 1 Alice ---
      ' FY24 budget $30,000 - 3 approved totaling $26,468
      InsPlanApproved db, 1, 1, 1, 2024, 2#         ' need 1 -> Acme/SN-RN/24 ($116): 2hr -> $12,064
      InsPlanApproved db, 2, 2, 5, 2024, 1#         ' need 2 -> Acme/PT/24 ($107): 1hr -> $5,564
      InsPlanApproved db, 3, 3, 11, 2024, 5#        ' need 3 -> Acme/PC-PERS/24 ($34): 5hr -> $8,840
      ' FY25 budget $32,000 - 2 approved totaling $17,628 + 1 pending $1,872
      InsPlanApproved db, 4, 4, 2, 2025, 2#         ' need 4 -> Acme/SN-RN/25 ($122): 2hr -> $12,688
      InsPlanApproved db, 5, 5, 6, 2025, 0.5        ' need 5 -> Acme/PT/25 ($112): 0.5hr -> $2,912
      InsPlanPending db, 6, 6, 12, 2025, 1#         ' need 6 -> Acme/PC-PERS/25 ($36): pending
  
      ' --- Client 2 Bob ---
      ' FY24 budget $45,000 - 4 approved totaling ~$36,608
      InsPlanApproved db, 7, 7, 1, 2024, 3#         ' need 7 -> Acme/SN-RN/24: 3hr -> $18,096
      InsPlanApproved db, 8, 8, 3, 2024, 2#         ' need 8 -> Acme/SN-LPN/24 ($78): 2hr -> $8,112
      InsPlanApproved db, 9, 9, 5, 2024, 1#         ' need 9 -> Acme/PT/24: 1hr -> $5,564
      InsPlanApproved db, 10, 10, 11, 2024, 3#      ' need 10 -> Acme/PC-PERS/24: 3hr -> $5,304
      ' FY24 cancelled plan (REQUIRES MACRO FIX TO PRESERVE)
      InsPlanCancelled db, 11, 11, 31, 2024, 2#     ' need 11 -> BrightPath/COMP/24 ($25): 2hr (would be $2,600)
  
      ' FY25 budget $47,500 - 3 approved totaling ~$36,608 + 1 pending
      InsPlanApproved db, 12, 12, 2, 2025, 3#       ' need 12 -> Acme/SN-RN/25: 3hr -> $19,032
      InsPlanApproved db, 13, 13, 4, 2025, 2#       ' need 13 -> Acme/SN-LPN/25 ($82): 2hr -> $8,528
      InsPlanApproved db, 14, 14, 6, 2025, 1#       ' need 14 -> Acme/PT/25: 1hr -> $5,824
      InsPlanPending db, 15, 15, 12, 2025, 2#       ' need 15 -> Acme/PC-PERS/25: 2hr pending
  
      ' --- Client 3 Clara ---
      ' FY24 budget $20,000 - 1 approved
      InsPlanApproved db, 16, 16, 21, 2024, 1#      ' need 16 -> BrightPath/PT/24 ($99): 1hr -> $5,148
      ' FY25 budget $22,000 - 1 approved + 1 pending
      InsPlanApproved db, 17, 18, 22, 2025, 1#      ' need 18 -> BrightPath/PT/25 ($104): 1hr -> $5,408
      InsPlanPending db, 18, 19, 26, 2025, 2#       ' need 19 -> BrightPath/PC-PERS/25 ($33): pending
  
      ' --- Client 4 Daniel (THE BUDGET OVERRUN CASE) ---
      ' FY24 budget $28,000 - 3 approved totaling $24,856
      InsPlanApproved db, 19, 21, 1, 2024, 2#       ' need 21 -> Acme/SN-RN/24: 2hr -> $12,064
      InsPlanApproved db, 20, 22, 5, 2024, 1#       ' need 22 -> Acme/PT/24: 1hr -> $5,564
      InsPlanApproved db, 21, 23, 11, 2024, 4#      ' need 23 -> Acme/PC-PERS/24: 4hr -> $7,072
      ' FY25 budget $30,000 - 2 approved totaling EXACTLY $28,288 + 1 pending of $1,872 = $30,160 (over by $160)
