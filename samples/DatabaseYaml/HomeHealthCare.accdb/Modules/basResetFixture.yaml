  Private Sub InsClient(ByVal db As DAO.Database, _
                        ByVal id As Long, ByVal first As String, ByVal last As String, _
                        ByVal dob As Date, ByVal enroll As Date, _
                        ByVal Gender As String, ByVal StateCode As String, _
                        ByVal City As String, ByVal active As Boolean)
      Dim ssn As String
      ssn = Format(1000 + id * 7, "0000")
      db.Execute "INSERT INTO tblClients (ClientID, FirstName, LastName, DateOfBirth, SSNLast4, " & _
                 "Gender, Address1, City, StateCode, ZipCode, Phone, Email, EmergencyContactName, " & _
                 "EmergencyContactPhone, EnrollmentDate, IsActive) VALUES (" & _
                 id & ", " & SqlStr(first) & ", " & SqlStr(last) & ", " & DateLit(dob) & ", " & _
                 SqlStr(ssn) & ", " & SqlStr(Gender) & ", " & _
                 SqlStr(id * 100 & " Main St") & ", " & SqlStr(City) & ", " & _
                 SqlStr(StateCode) & ", " & SqlStr("10000") & ", " & _
                 SqlStr("(555) 010-" & Format(id * 100, "0000")) & ", " & _
                 SqlStr(LCase(first) & "." & LCase(last) & "@example.com") & ", " & _
                 SqlStr(first & " EmergencyContact") & ", " & SqlStr("(555) 020-0000") & ", " & _
                 DateLit(enroll) & ", " & BoolLit(active) & ")", dbFailOnError
  End Sub
  
