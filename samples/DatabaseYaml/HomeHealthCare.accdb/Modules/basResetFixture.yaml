      InsPlanApproved db, 23, 25, 6, 2025, 0.5      ' need 25 -> Acme/PT/25 ($112): 0.5hr -> $2,912
      InsPlanPending db, 24, 26, 12, 2025, 1#       ' need 26 -> Acme/PC-PERS/25 ($36): 1hr -> $1,872
                                                    ' Approving would push total to $30,160 > $30,000.
  
      ' --- Client 5 Eleanor (has unmet need #31 in FY25) ---
