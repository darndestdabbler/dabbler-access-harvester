                 SqlStr("(555) 200-" & Format(id * 100, "0000")) & ", " & _
                 SqlStr(LCase(Replace(name, " ", "")) & "@example.com") & ", " & _
                 SqlStr(id * 100 & " Provider Way") & ", " & SqlStr(City) & ", " & _
                 SqlStr(StateCode) & ", " & SqlStr("10000") & ", " & _
